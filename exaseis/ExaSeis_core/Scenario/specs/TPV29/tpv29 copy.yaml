domain:
  offset: [-4.3,  0.0, -4.3]
  size:   [48.6, 48.6, 48.6]
  mode:   [ {{MODE}}, {{MODE}}, {{MODE}}  ]
topography: !Analytic
  coordinates: ["Z","X"]
  top: true
  perturbation: !ConstantMap
    map: 
      y: 0
  split:
    coordinates: ["Z","Y"]
    position: 20.0
    perturbation: !AffineMap
      matrix:
        z: [0.0, 1.0, 0.0]
        y: [0.0, 0.0, 1.0]
      translation:
        z:  0.0
        y: -20.0
      components:
        - !AxisAlignedCuboidalDomainFilter
          limits:
            z: [0.0 ,25.0]
            y: [-25.0,25.0]
          components: !ASAGI
            file: tpv29_fault_disp.nc
            parameters: [x]
            var: data
        - !ConstantMap
          map:
            x: 0.0
