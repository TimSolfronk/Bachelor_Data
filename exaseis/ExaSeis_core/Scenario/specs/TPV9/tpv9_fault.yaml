    s_yy: 0
    s_zz: 0
    s_yz: 0    
    s_xz: 0.0
[n_yz,s_xy,s_xx]: !FunctionMap
  map:
    n_yz: return 0.0;
    s_xx: return 7.378 * y;
    s_xy: |
      if ((10.5 <= y) && (y <= 13.5)) {
         if ((18.5 <= z) && (z <= 21.5)) {
            return 1.0 + (1.005 * 0.760 * 7.378 * y);
         }        
      }
      return 0.55 * 7.378 * y;
