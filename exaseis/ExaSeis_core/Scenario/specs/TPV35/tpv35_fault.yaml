!Switch
[s_xx, s_yy, s_zz, s_yz, s_xy]: !ConstantMap
  map:
    s_xx: -60.0
    s_yy: 0.0
    s_zz: 0.0
    s_yz: 0.0
    s_xy: 0.0
[mu_s, s_xz]: !AffineMap
  matrix:
    z: [0.0, 1.0, 0.0]
    y: [0.0, 0.0, 1.0]
  translation:
    z: 0.0
    y: -20.0
  components:
    - !AxisAlignedCuboidalDomainFilter
      limits:
        z: [0,15.5]
        y: [-20.0 ,20.0]
      components: !ASAGI
        file: tpv35_muS_sXZ.nc
        parameters: [mu_s, s_xz]
        var: data
    - !ConstantMap
      map:
        mu_s: 0.677
        s_xz: 0.0
[t_0, f_cy, f_wy, f_cz, f_wz, n_yz, cohesion, mu_d, d_c, forced_rupture_time]: !ConstantMap
  map:
     t_0  : 0.5
     f_cy : 0.0
     f_wy : 15.5
     f_cz : 20.0
     f_wz : 20.0
     n_yz : 0.0
     cohesion: 0.0
     mu_d : 0.3
     d_c  : 0.15 
     forced_rupture_time : 1000000000.0
